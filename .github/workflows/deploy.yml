
name: CI

on:
  push:
    branches:
      - main
      - pages
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.com/wylieyyyy/isometric-drawing:latest
    steps:
      - uses: actions/checkout@v6
      - run: npm install
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.com/wylieyyyy/isometric-drawing:latest
    steps:
      - uses: actions/checkout@v6
      - run: npm install
      - name: Install Playwright Firefox
        run: npx playwright install --with-deps firefox
        env:
          HOME: /root
      - name: Run tests
        run: npm run test
        env:
          HOME: /root

  build:
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.com/wylieyyyy/isometric-drawing:latest
    steps:
      - uses: actions/checkout@v6
      - run: npm install
      - run: npm run build
      - run: npm run build:lib
      - run: npm run docs

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/pages')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

